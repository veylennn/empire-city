<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EmpireCity State</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем стильный моноширинный шрифт для баланса -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #050508;
      color: #f8fafc;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Анимированный космос */
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Карточка персонажа */
    .glass-card {
      background: rgba(18, 18, 26, 0.5); /* Более прозрачный фон */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(234, 179, 8, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(234, 179, 8, 0.03);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
    }

    .user-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .user-info p {
      font-size: 12px;
      color: #e2e8f0;
      opacity: 0.75;
    }

    .lvl-badge {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(202, 138, 4, 0.3));
      border: 1px solid rgba(234, 179, 8, 0.8);
      color: #fef08a;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.15);
    }

    .balance-box {
      margin-top: 16px;
      background: rgba(8, 8, 12, 0.45);
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .balance-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Новый строгий моноширинный шрифт для финансового баланса */
    .balance-amount {
      font-family: 'Roboto Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #facc15;
      margin-top: 4px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 10px rgba(234, 179, 8, 0.25);
    }

    /* Вертикальное Главное Меню (3 Прозрачные Кнопки) */
    .main-menu-vertical {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .glass-btn-large {
      background: rgba(18, 18, 26, 0.35); /* Ещё более прозрачные */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(234, 179, 8, 0.25);
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.15s ease;
    }

    .glass-btn-large:active, .glass-btn:active {
      transform: scale(0.97);
      border-color: #facc15;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.5);
      background: rgba(234, 179, 8, 0.15);
    }

    /* Подразделы */
    .sub-screen {
      display: none;
      animation: fadeIn 0.25s ease;
      flex-direction: column;
      gap: 14px;
    }

    .sub-screen.active {
      display: flex;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .glass-btn {
      background: rgba(18, 18, 26, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(234, 179, 8, 0.2);
      color: #f8fafc;
      padding: 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-back {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.6);
      color: #fef08a;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 4px;
      transition: all 0.15s ease;
    }

    .section-title {
      font-size: 13px;
      color: #eab308;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <div class="app-container">

    <!-- Карточка Профиля -->
    <div class="glass-card">
      <div class="header">
        <div class="user-profile">
          <div class="avatar" id="user-avatar">😎</div>
          <div class="user-info">
            <h2 id="user-name">Игрок
