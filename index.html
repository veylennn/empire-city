<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EmpireCity State</title>
  <!-- Подключаем Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }
    .user-info h2 {
      font-size: 18px;
    }
    .user-info p {
      font-size: 13px;
      color: #94a3b8;
    }
    .balance-box {
      margin-top: 16px;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
    }
    .balance-title {
      font-size: 12px;
      color: #94a3b8;
    }
    .balance-amount {
      font-size: 18px;
      font-weight: bold;
      color: #10b981;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn {
      background: #2563eb;
      border: none;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #334155;
    }
  </style>
</head>
<body>

  <!-- Карточка Профиля -->
  <div class="card">
    <div class="header">
      <div class="avatar" id="user-avatar">😎</div>
      <div class="user-info">
        <h2 id="user-name">Игрок</h2>
        <p id="user-status">Гражданин EmpireCity</p>
      </div>
    </div>
    <div class="balance-box">
      <div>
        <div class="balance-title">Наличные</div>
        <div class="balance-amount" id="cash">$ 5,000</div>
      </div>
      <div>
        <div class="balance-title">В банке</div>
        <div class="balance-amount" id="bank">$ 50,000</div>
      </div>
    </div>
  </div>

  <!-- Главные локации Города -->
  <h3 style="font-size: 16px; color: #94a3b8;">Городские локации</h3>
  <div class="nav-grid">
    <button class="btn" onclick="alert('Автосалон скоро откроется!')">🚘 Автосалон</button>
    <button class="btn" onclick="alert('Аукцион пока пуст!')">🔨 Аукцион</button>
    <button class="btn" onclick="alert('Банк готов к операциям!')">🏦 Банк</button>
    <button class="btn" onclick="alert('МФЦ: Выдача номеров временно недоступна!')">📋 Номера & МФЦ</button>
  </div>

  <!-- Второстепенное Меню -->
  <h3 style="font-size: 16px; color: #94a3b8; margin-top: 8px;">Меню</h3>
  <div class="nav-grid">
    <button class="btn btn-secondary" onclick="alert('Промокоды будут доступны в следующем обновлении!')">🎁 Промокоды</button>
    <button class="btn btn-secondary" onclick="alert('Настройки профиля')">⚙️ Настройки</button>
  </div>

  <script>
    // Безопасная инициализация Telegram WebApp
    document.addEventListener("DOMContentLoaded", function () {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        
        try {
          tg.expand();
          tg.ready();
        } catch (e) {
          console.log("Ошибка вызова expand:", e);
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          const user = tg.initDataUnsafe.user;
          const name = user.first_name + (user.last_name ? ' ' + user.last_name : '');
          document.getElementById('user-name').innerText = name;
          document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
        }
      }
    });
  </script>
</body>
</html>
