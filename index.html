<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EmpireCity State</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #050508;
      color: #f8fafc;
      padding: 16px 16px 90px 16px; /* Отступ снизу под Bottom Bar */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Анимированный космос */
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Верхняя плашка состояния сервера */
    .server-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      padding: 0 4px;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4ade80;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Карточка Профиля (Кликабельная) */
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 18px;
      border: 1px solid rgba(234, 179, 8, 0.35);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .glass-card:active {
      transform: scale(0.98);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #facc15, #ca8a04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #000;
      box-shadow: 0 0 18px rgba(234, 179, 8, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .vip-tag {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #000;
      color: #facc15;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 5px;
      border: 1px solid #eab308;
    }

    .user-info h2 {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .user-info p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 1px;
    }

    .lvl-badge {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.6);
      color: #fef08a;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Шкала Опыта (XP) */
    .xp-container {
      margin-top: 12px;
    }

    .xp-info {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .xp-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .xp-bar-fill {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, #ca8a04, #facc15);
      box-shadow: 0 0 8px #facc15;
    }

    /* Финансовые Блоки */
    .balance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .balance-card {
      background: rgba(10, 10, 15, 0.55);
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .balance-header {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }

    .balance-amount {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      margin-top: 2px;
    }

    /* Интерактивные Игровые Баннеры */
    .hub-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hub-card {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    .hub-card:active {
      transform: scale(0.97);
      border-color: #facc15;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
    }

    .hub-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hub-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .hub-text h3 {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hub-text p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .badge-claim {
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: #22c55e;
      color: #000;
      text-transform: uppercase;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .arrow-icon {
      font-size: 16px;
      color: #eab308;
      opacity: 0.8;
    }
