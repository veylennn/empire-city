<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EmpireCity State</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #050508;
      color: #f8fafc;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Анимированный космос */
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Карточка персонажа */
    .glass-card {
      background: rgba(18, 18, 26, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(234, 179, 8, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(234, 179, 8, 0.03);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
    }

    .user-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .user-info p {
      font-size: 12px;
      color: #e2e8f0;
      opacity: 0.75;
    }

    .lvl-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.8);
      color: #fef08a;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.15);
    }

    .balance-box {
      margin-top: 16px;
      background: rgba(8, 8, 12, 0.5);
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .balance-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Моноширинный строго финансовый шрифт */
    .balance-amount {
      font-family: 'Courier New', Courier, monospace;
      font-size: 18px;
      font-weight: 700;
      color: #facc15;
      margin-top: 4px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 10px rgba(234, 179, 8, 0.25);
    }

    /* Вертикальное Главное Меню */
    .main-menu-vertical {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .glass-btn-large {
      background: rgba(18, 18, 26, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(234, 179, 8, 0.25);
      color: #ffffff;
      padding: 18px 20px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.15s ease;
    }

    .glass-btn-large:active, .glass-btn:active {
      transform: scale(0.97);
      border-color: #facc15;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.5);
      background: rgba(234, 179, 8, 0.15);
    }

    /* Подразделы */
    .sub-screen {
      display: none;
      animation: fadeIn 0.25s ease;
      flex-direction: column;
      gap: 14px;
    }

    .sub-screen.active {
      display: flex;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .glass-btn {
      background: rgba(18, 18, 26, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(234, 179, 8, 0.2);
      color: #f8fafc;
      padding: 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn-back {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.6);
      color: #fef08a;
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 4px;
      transition: all 0.15s ease;
    }

    .section-title {
      font-size: 13px;
      color: #eab308;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <div class="app-container">

    <!-- Карточка Профиля -->
    <div class="glass-card">
      <div class="header">
        <div class="user-profile">
          <div class="avatar" id="user-avatar">😎</div>
          <div class="user-info">
            <h2 id="user-name">Игрок</h2>
            <p id="user-status">Гражданин EmpireCity</p>
          </div>
        </div>
        <div class="lvl-badge">⭐ LVL 1</div>
      </div>
      
      <div class="balance-box">
        <div>
          <div class="balance-title">Наличные</div>
          <div class="balance-amount" id="cash">$ 5,000</div>
        </div>
        <div style="text-align: right;">
          <div class="balance-title">Счёт</div>
          <div class="balance-amount" id="bank">$ 50,000</div>
        </div>
      </div>
    </div>

    <!-- ВЕРТИКАЛЬНОЕ ГЛАВНОЕ МЕНЮ (3 Прозрачные Кнопки) -->
    <div id="main-screen" class="main-menu-vertical">
      <button class="glass-btn-large" onclick="openScreen('screen-profile')">
        <span>👤 Профиль</span>
        <span style="color: #eab308;">➔</span>
      </button>
      <button class="glass-btn-large" onclick="openScreen('screen-city')">
        <span>🏙️ Город</span>
        <span style="color: #eab308;">➔</span>
      </button>
      <button class="glass-btn-large" onclick="openScreen('screen-other')">
        <span>⚙️ Прочее</span>
        <span style="color: #eab308;">➔</span>
      </button>
    </div>

    <!-- ЭКРАН 1: ПРОФИЛЬ -->
    <div id="screen-profile" class="sub-screen">
      <button class="btn-back" onclick="goHome()">⬅️ В главное меню</button>
      <div class="section-title">Раздел Профиль</div>
      <div class="content-grid">
        <button class="glass-btn" onclick="alert('Статистика персонажа')">📊 Статистика</button>
        <button class="glass-btn" onclick="alert('Инвентарь пуст!')">🎒 Инвентарь</button>
      </div>
    </div>

    <!-- ЭКРАН 2: ГОРОД -->
    <div id="screen-city" class="sub-screen">
      <button class="btn-back" onclick="goHome()">⬅️ В главное меню</button>
      <div class="section-title">Локации Города</div>
      <div class="content-grid">
        <button class="glass-btn" onclick="alert('Центр занятости')">💼 Работа</button>
        <button class="glass-btn" onclick="alert('Центральный Банк')">🏦 Банк</button>
        <button class="glass-btn" onclick="alert('Салон связи')">📱 Салон связи</button>
        <button class="glass-btn" onclick="alert('Аукцион')">🔨 Аукцион</button>
        <button class="glass-btn" onclick="alert('Автосалон Luxury')">🚘 Автосалоны</button>
        <button class="glass-btn" onclick="alert('Агентство недвижимости')">🏠 Недвижимость</button>
      </div>
    </div>

    <!-- ЭКРАН 3: ПРОЧЕЕ -->
    <div id="screen-other" class="sub-screen">
      <button class="btn-back" onclick="goHome()">⬅️ В главное меню</button>
      <div class="section-title">Дополнительно</div>
      <div class="content-grid">
        <button class="glass-btn" onclick="alert('Настройки профиля')">⚙️ Настройки</button>
        <button class="glass-btn" onclick="alert('Активация промокода')">🎁 Промокоды</button>
      </div>
    </div>

  </div>

  <script>
    function openScreen(screenId) {
      document.getElementById('main-screen').style.display = 'none';
      document.querySelectorAll('.sub-screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function goHome() {
      document.querySelectorAll('.sub-screen').forEach(s => s.classList.remove('active'));
      document.getElementById('main-screen').style.display = 'flex';
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        try { tg.expand(); tg.ready(); } catch (e) {}

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          const user = tg.initDataUnsafe.user;
          const name = user.first_name + (user.last_name ? ' ' + user.last_name : '');
          document.getElementById('user-name').innerText = name;
          document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
        }
      }
    });

    const canvas = document.getElementById('space-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 65 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.2,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    }));

    const shootingStars = [];

    function createShootingStar() {
      if (shootingStars.length < 3 && Math.random() < 0.035) {
        shootingStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height / 2),
          length: Math.random() * 80 + 40,
          speed: Math.random() * 10 + 6,
          dx: (Math.random() - 0.3) * 6,
          dy: Math.random() * 6 + 4,
          alpha: 1
        });
      }
    }

    function animateSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.fill();
      });

      createShootingStar();
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        s.x += s.dx;
        s.y += s.dy;
        s.alpha -= 0.015;

        if (s.alpha <= 0 || s.x < 0 || s.x > canvas.width || s.y > canvas.height) {
          shootingStars.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        const gradient = ctx.createLinearGradient(s.x, s.y, s.x - s.dx * 5, s.y - s.dy * 5);
        gradient.addColorStop(0, `rgba(250, 204, 21, ${s.alpha})`);
        gradient.addColorStop(1, `rgba(234, 179, 8, 0)`);
        
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.dx * (s.length / 10), s.y - s.dy * (s.length / 10));
        ctx.stroke();
      }

      requestAnimationFrame(animateSpace);
    }

    animateSpace();
  </script>
</body>
</html>
