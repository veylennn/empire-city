<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EmpireCity State</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #08080c;
      color: #ffffff;
      padding: 16px 16px 85px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow-x: hidden;
    }

    /* Анимированный фоновый Canvas */
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Индикатор сервера */
    .server-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #22c55e;
    }

    .dot {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Главная карточка игрока */
    .glass-card {
      background: rgba(18, 18, 26, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(234, 179, 8, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 15px;
      background: linear-gradient(135deg, #facc15, #ca8a04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #000;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .vip-tag {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #000;
      color: #facc15;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #eab308;
    }

    .user-info h2 {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
    }

    .user-info p {
      font-size: 11px;
      color: #94a3b8;
    }

    .lvl-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.7);
      color: #fef08a;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Шкала Опыта */
    .xp-container {
      margin-top: 12px;
    }

    .xp-info {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .xp-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .xp-bar-fill {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, #ca8a04, #facc15);
    }

    /* Финансовый блок */
    .balance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .balance-card {
      background: rgba(10, 10, 15, 0.6);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .balance-header {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
    }

    .balance-amount {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      margin-top: 3px;
    }

    /* Игровой Хаб (Центральные кнопки) */
    .hub-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hub-card {
      background: rgba(18, 18, 26, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .hub-card:active {
      transform: scale(0.97);
      border-color: #facc15;
      background: rgba(234, 179, 8, 0.15);
    }

    .hub-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hub-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .hub-text h3 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hub-text p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 1px;
    }

    .badge-claim {
      font-size: 8px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #22c55e;
      color: #000;
      text-transform: uppercase;
    }

    .arrow-icon {
      font-size: 15px;
      color: #eab308;
    }

    /* Экраны разделов */
    .sub-screen {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .sub-screen.active {
      display: flex;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .glass-btn {
      background: rgba(18, 18, 26, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(234, 179, 8, 0.2);
      color: #f8fafc;
      padding: 14px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .glass-btn:active {
      transform: scale(0.96);
      border-color: #facc15;
    }

    .btn-back {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.6);
      color: #fef08a;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* Нижняя навигация */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 65px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(234, 179, 8, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #64748b;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      width: 25%;
      text-align: center;
    }

    .tab-item .tab-icon {
      font-size: 18px;
    }

    .tab-item.active {
      color: #facc15;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #fff;
      font-size: 13px;
      outline: none;
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <div class="app-container">

    <!-- Статус Сервера -->
    <div class="server-status">
      <span>EMPIRE CITY STATE</span>
      <div class="status-online">
        <span class="dot"></span>
        <span>142 Онлайн</span>
      </div>
    </div>

    <!-- Карточка Профиля -->
    <div class="glass-card" onclick="openScreen('screen-profile')">
      <div class="header">
        <div class="user-profile">
          <div class="avatar-wrapper">
            <div class="avatar" id="user-avatar">😎</div>
            <div class="vip-tag">VIP</div>
          </div>
          <div class="user-info">
            <h2 id="user-name">Игрок</h2>
            <p id="user-status">Гражданин EmpireCity</p>
          </div>
        </div>
        <div class="lvl-badge">⭐ LVL 1</div>
      </div>

      <div class="xp-container">
        <div class="xp-info">
          <span>Прогресс уровня</span>
          <span>350 / 1000 XP</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fill"></div>
        </div>
      </div>
      
      <div class="balance-grid">
        <div class="balance-card">
          <div class="balance-header">
            <span>💵</span> Наличные
          </div>
          <div class="balance-amount" id="cash">$ 5 000</div>
        </div>
        <div class="balance-card">
          <div class="balance-header">
            <span>💳</span> Счёт
          </div>
          <div class="balance-amount" id="bank">$ 50 000</div>
        </div>
      </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН HAF -->
    <div id="main-screen" class="sub-screen active">
      <div class="hub-container">
        
        <div class="hub-card" onclick="claimDailyReward()">
          <div class="hub-card-left">
            <div class="hub-icon-box">🎁</div>
            <div class="hub-text">
              <h3>Бонус <span class="badge-claim">ГОТОВ</span></h3>
              <p>Заберите ежедневную награду</p>
            </div>
          </div>
          <span class="arrow-icon">➔</span>
        </div>

        <div class="hub-card" onclick="openScreen('screen-work')">
          <div class="hub-card-left">
            <div class="hub-icon-box">💼</div>
            <div class="hub-text">
              <h3>Биржа Труда</h3>
              <p>Доступна работа и заказы</p>
            </div>
          </div>
          <span class="arrow-icon">➔</span>
        </div>

        <div class="hub-card" onclick="openScreen('screen-city')">
          <div class="hub-card-left">
            <div class="hub-icon-box">🏙️</div>
            <div class="hub-text">
              <h3>Карта Города</h3>
              <p>Банк, автосалоны, недвижимость</p>
            </div>
          </div>
          <span class="arrow-icon">➔</span>
        </div>
