<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EmpireCity State</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050508;
      overflow-x: hidden;
    }

    body {
      color: #f8fafc;
      padding: 16px 16px 120px 16px;
      position: relative;
    }

    /* ЖЕСТКИЙ СЛОЙ ФОНА КОСМОСА (КЛИКИ ИГНОРИРУЮТСЯ) */
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none !important;
    }

    .app-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Шапка Сервера */
    .server-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #22c55e;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Карточка Профиля */
    .glass-card {
      background: rgba(18, 18, 28, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(234, 179, 8, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }

    .glass-card:active {
      transform: scale(0.98);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #facc15, #ca8a04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #000;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .vip-tag {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #000;
      color: #facc15;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #eab308;
    }

    .user-info h2 {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }

    .user-info p {
      font-size: 12px;
      color: #94a3b8;
    }

    .phone-tag {
      font-size: 11px;
      color: #facc15;
      font-weight: 700;
      margin-top: 2px;
    }

    .lvl-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.7);
      color: #fef08a;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .xp-container {
      margin-top: 12px;
    }

    .xp-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .xp-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .xp-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ca8a04, #facc15);
      box-shadow: 0 0 8px #facc15;
      transition: width 0.2s ease;
    }
