<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EmpireCity // Midnight Noir</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(15, 18, 25, 0.85);
      --border-color: rgba(56, 189, 248, 0.2);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px 16px 90px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновый нуар-градиент */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .server-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #38bdf8;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* Профиль в стиле Нуар */
    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .user-details h2 {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }

    .user-details p {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 700;
      margin-top: 2px;
    }

    .lvl-badge {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .balance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .balance-card {
      background: rgba(9, 10, 15, 0.8);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .balance-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .balance-val {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: 800;
      color: #38bdf8;
      margin-top: 3px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }

    .screen.active {
      display: flex;
    }

    .hub-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, background 0.2s;
    }

    .hub-card:active {
      transform: scale(0.97);
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
    }

    .hub-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hub-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .hub-text h3 {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
    }

    .hub-text p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* СТИЛЬНАЯ SIM-КАРТА (Dark Carbon & Steel) */
    .sim-card-container {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 4px;
      transition: box-shadow 0.5s ease;
    }

    .glow-common { box-shadow: 0 0 25px rgba(100, 116, 139, 0.3); }
    .glow-rare { box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); }
    .glow-epic { box-shadow: 0 0 35px rgba(168, 85, 247, 0.6); }
    .glow-legendary { box-shadow: 0 0 40px rgba(250, 204, 21, 0.7); }
    .glow-mythic { box-shadow: 0 0 50px rgba(239, 68, 68, 0.8); animation: pulseMythic 1s infinite alternate; }

    @keyframes pulseMythic {
      0% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }
      100% { box-shadow: 0 0 60px rgba(239, 68, 68, 1); }
    }

    .sim-card-model {
      width: 100%;
      height: 165px;
      background: linear-gradient(135deg, #111827 0%, #030712 100%);
      border-radius: 15px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    .sim-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .sim-brand {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .sim-operator {
      font-size: 10px;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .sim-chip {
      width: 38px;
      height: 28px;
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%);
      border-radius: 5px;
      border: 1px solid #a16207;
      position: relative;
      z-index: 2;
    }
    .sim-chip::after {
      content: '';
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 2px;
    }

    .external-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 16px;
      border-radius: 12px;
    }

    .external-value {
      font-size: 13px;
      font-weight: 900;
      color: #38bdf8;
    }

    .external-rarity {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .color-common { color: #64748b; }
    .color-rare { color: #38bdf8; }
    .color-epic { color: #c084fc; }
    .color-legendary { color: #facc15; }
    .color-mythic { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.5); }

    .sim-number-display {
      font-family: 'Courier New', Courier, monospace !important;
      font-size: 17px !important;
      font-weight: 900 !important;
      color: #e2e8f0 !important;
      letter-spacing: 1px;
      text-align: center;
      background: rgba(3, 7, 18, 0.85);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      z-index: 2;
    }

    .char-fade {
      opacity: 0;
      transform: translateY(6px);
      animation: charIn 0.3s forwards ease;
      font-family: 'Courier New', Courier, monospace !important;
      font-weight: 900 !important;
      font-variant-numeric: tabular-nums;
    }

    @keyframes charIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* УВЕДОМЛЕНИЕ */
    #game-toast {
